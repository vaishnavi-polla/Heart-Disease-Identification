<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | Heart Disease Identification</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(5, 35, 65, 0.88),
                    rgba(8, 90, 115, 0.90)
                ),
                url("{{ url_for('static', filename='images/medical-bg.jpg') }}");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            color: white;

            display: flex;

            flex-direction: column;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            height: 75px;

            padding: 0 8%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(4, 25, 45, 0.90);

            backdrop-filter: blur(12px);

            border-bottom:
                1px solid
                rgba(255,255,255,0.12);
        }


        .logo {

            font-size: 24px;

            font-weight: bold;
        }


        .heart {

            color: #ff4f81;
        }


        .blue {

            color: #22d3ee;
        }


        .back {

            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 25px;

            transition: 0.3s;
        }


        .back:hover {

            background:
                rgba(34,211,238,0.15);

            color: #22d3ee;
        }


        /* =========================
           MAIN
        ========================= */

        .main {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;
        }


        .register-card {

            width: 430px;

            max-width: 100%;

            padding: 40px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.12);

            backdrop-filter: blur(18px);

            border:
                1px solid
                rgba(255,255,255,0.22);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.30);

            text-align: center;
        }


        .icon {

            width: 65px;

            height: 65px;

            margin: auto;

            margin-bottom: 18px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 31px;

            background:
                rgba(255,79,129,0.18);
        }


        h1 {

            font-size: 30px;

            margin-bottom: 8px;
        }


        h1 span {

            color: #22d3ee;
        }


        .subtitle {

            color: #d8f6ff;

            margin-bottom: 28px;

            font-size: 15px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            text-align: left;

            margin-bottom: 17px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            color: #e8faff;
        }


        input {

            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.25);

            outline: none;

            background:
                rgba(255,255,255,0.90);

            color: #172b3a;

            font-size: 15px;
        }


        input:focus {

            border-color: #22d3ee;

            box-shadow:
                0 0 12px
                rgba(34,211,238,0.25);
        }


        /* =========================
           BUTTON
        ========================= */

        .register-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 25px;

            margin-top: 8px;

            font-size: 16px;

            font-weight: bold;

            color: white;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #ff4f81,
                    #22b8d6
                );

            transition: 0.3s;
        }


        .register-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.25);
        }


        /* =========================
           ERROR
        ========================= */

        .error {

            padding: 11px;

            margin-bottom: 18px;

            border-radius: 10px;

            background:
                rgba(255,70,100,0.18);

            border:
                1px solid
                rgba(255,120,140,0.35);

            color: #ffd7df;

            font-size: 14px;
        }


        .login-link {

            margin-top: 22px;

            font-size: 14px;

            color: #d8f6ff;
        }


        .login-link a {

            color: #22d3ee;

            text-decoration: none;

            font-weight: bold;
        }


        .login-link a:hover {

            text-decoration: underline;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            padding: 17px;

            text-align: center;

            background:
                rgba(4,25,45,0.90);

            color:
                rgba(255,255,255,0.75);

            font-size: 13px;
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">

        <span class="heart">❤️</span>

        Heart Disease
        <span class="blue">Identification</span>

    </div>


    <a href="{{ url_for('login') }}"
       class="back">

        ← Back

    </a>

</nav>



<!-- REGISTER -->

<main class="main">

    <div class="register-card">


        <div class="icon">

            👤

        </div>


        <h1>

            Create <span>Account</span>

        </h1>


        <p class="subtitle">

            Create your account to access
            your personal dashboard.

        </p>


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <form method="POST"
              action="{{ url_for('register') }}" autocomplete="off">


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn">

                Create Account →

            </button>


        </form>


        <div class="login-link">

            Already have an account?

            <a href="{{ url_for('patient_login') }}">

                Login

            </a>

        </div>


    </div>

</main>



<footer class="footer">

    ❤️ Your Heart, Our Priority

</footer>


</body>

</html>
