<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patient Login | Heart Disease Identification</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(5, 35, 65, 0.88),
                    rgba(8, 90, 115, 0.88)
                ),
                url("{{ url_for('static', filename='images/medical-bg.jpg') }}");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            flex-direction: column;

            color: #ffffff;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            height: 75px;

            padding: 0 8%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(4, 25, 45, 0.88);

            backdrop-filter: blur(12px);

            border-bottom:
                1px solid
                rgba(255,255,255,0.12);
        }


        .logo {

            font-size: 24px;

            font-weight: bold;

            letter-spacing: 0.3px;
        }


        .logo .heart {

            color: #ff4f81;

            margin-right: 5px;
        }


        .logo .blue {

            color: #22d3ee;
        }


        .back {

            color: white;

            text-decoration: none;

            font-size: 15px;

            padding: 10px 20px;

            border-radius: 25px;

            transition: 0.3s;
        }


        .back:hover {

            background:
                rgba(34,211,238,0.15);

            color: #22d3ee;
        }


        /* =========================
           MAIN
        ========================= */

        .main {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px 20px;
        }


        .login-card {

            width: 420px;

            max-width: 100%;

            padding: 42px 38px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.12);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            border:
                1px solid
                rgba(255,255,255,0.22);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.30);

            text-align: center;

            animation:
                cardAppear 0.7s ease;
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(25px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .heart-icon {

            width: 65px;

            height: 65px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(255,79,129,0.18);

            font-size: 32px;

            box-shadow:
                0 0 25px
                rgba(255,79,129,0.25);
        }


        h1 {

            font-size: 31px;

            margin-bottom: 8px;
        }


        h1 span {

            color: #22d3ee;
        }


        .subtitle {

            color: #d8f6ff;

            font-size: 15px;

            margin-bottom: 30px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            text-align: left;

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #e5faff;
        }


        .form-group input {

            width: 100%;

            padding: 14px 16px;

            border: 1px solid
                rgba(255,255,255,0.25);

            border-radius: 12px;

            outline: none;

            background:
                rgba(255,255,255,0.12);

            color: white;

            font-size: 15px;

            transition: 0.3s;
        }


        .form-group input::placeholder {

            color:
                rgba(255,255,255,0.60);
        }


        .form-group input:focus {

            border-color: #22d3ee;

            background:
                rgba(255,255,255,0.16);

            box-shadow:
                0 0 12px
                rgba(34,211,238,0.20);
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {

            width: 100%;

            border: none;

            padding: 14px;

            margin-top: 8px;

            border-radius: 25px;

            font-size: 16px;

            font-weight: bold;

            color: white;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #ff4f81,
                    #22b8d6
                );

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.20);

            transition: 0.3s;
        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(0,0,0,0.30);
        }


        /* =========================
           ERROR
        ========================= */

        .error {

            margin-bottom: 18px;

            padding: 11px;

            border-radius: 10px;

            background:
                rgba(255,80,100,0.18);

            border:
                1px solid
                rgba(255,120,140,0.35);

            color: #ffd5dd;

            font-size: 14px;
        }
          


                {% if success %}

       <div class="success">

            {{ success }}

</div>

          {% endif %}
  .success {

    padding: 11px;

    margin-bottom: 18px;

    border-radius: 10px;

    background: rgba(50, 220, 170, 0.15);

    border: 1px solid rgba(50, 220, 170, 0.35);

    color: #b9ffe9;

    font-size: 14px;
}

        /* =========================
           REGISTER
        ========================= */

        .register {

            margin-top: 22px;

            font-size: 14px;

            color: #d8f6ff;
        }


        .register a {

            color: #22d3ee;

            text-decoration: none;

            font-weight: bold;
        }


        .register a:hover {

            text-decoration: underline;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            padding: 18px;

            text-align: center;

            background:
                rgba(4,25,45,0.90);

            color:
                rgba(255,255,255,0.75);

            font-size: 13px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 500px) {

            .navbar {

                padding: 0 20px;
            }

            .logo {

                font-size: 19px;
            }

            .login-card {

                padding: 35px 25px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="logo">

        <span class="heart">❤️</span>

        Heart Disease
        <span class="blue">Identification</span>

    </div>

<a href="{{ url_for('login') }}"
   class="back">
    ← Back
</a>

    

</nav>



<!-- =========================
     LOGIN
========================= -->

<main class="main">

    <div class="login-card">


        <div class="heart-icon">

            ❤️

        </div>


        <h1>

            Patient <span>Login</span>

        </h1>


        <p class="subtitle">

            Login to access your personal
            heart health dashboard.If you
            have a account.

        </p>


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <!-- IMPORTANT -->
        <!-- This form sends username/password to Flask -->

        <form method="POST"
              action="{{ url_for('patient_login') }}" autocomplete="off">


            <div class="form-group">

                <label for="username">

                    Username

                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="off"
                    placeholder="Enter your username"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn">

                Login to Dashboard →

            </button>


        </form>


        <div class="register">

            Don't have an account?

            <a href="{{ url_for('register') }}">

                Create Account

            </a>

        </div>


    </div>

</main>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    ❤️ Your Heart, Our Priority

</footer>
<script>
window.addEventListener("pageshow", function (event) {
    if (event.persisted || performance.getEntriesByType("navigation")[0]?.type === "back_forward") {
        document.querySelector("form").reset();
    }
});
</script>

</body>

</html>
