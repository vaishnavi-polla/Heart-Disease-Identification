<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - HeartCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
          <style>

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            rgba(5, 25, 55, 0.55),
            rgba(5, 40, 80, 0.65)
        ),
        url("{{ url_for('static', filename='images/image.png') }}");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

        .menu {
    background: rgba(8, 45, 75, 0.65);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border: 1px solid rgba(255, 255, 255, 0.20);

    border-radius: 20px;

    padding: 12px 25px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25);
}
.menu a {
    color: rgb(50, 32, 32);

    text-decoration: none;

    padding: 10px 18px;

    border-radius: 12px;

    transition: 0.3s;
}

.menu a:hover {
    background: rgba(30, 200, 225, 0.25);

    color: #22d3ee;

    box-shadow:
        0 0 15px rgba(34, 211, 238, 0.20);
}
.logo {
    font-size: 23px;
    font-weight: bold;
    color: #e63956;
}
.navbar {
    background: #071e3d;
}

</style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ❤️ HeartCare
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

        </div>

    </nav>


    <section class="login-section">

        <div class="login-card">

            <h1>Welcome</h1>

            <p>
                Please select how you would like to continue.
            </p>


            <a href="/patient-login"
               class="login-option">

                👤 Patient / User

            </a>


            <a href="/admin-login"
               class="login-option">

                🔐 Admin

            </a>


        </div>

    </section>

</body>

</html>
