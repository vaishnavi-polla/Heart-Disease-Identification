<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | Heart Disease Identification</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            color: white;

            background:
                linear-gradient(
                    rgba(5, 35, 65, 0.88),
                    rgba(8, 90, 115, 0.90)
                ),
                url("{{ url_for('static', filename='images/medical-bg.jpg') }}");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }


        .navbar {

            height: 75px;

            padding: 0 7%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: rgba(4, 25, 45, 0.92);

            backdrop-filter: blur(12px);
        }


        .logo {

            font-size: 22px;

            font-weight: bold;
        }


        .heart {
            color: #ff4f81;
        }


        .blue {
            color: #22d3ee;
        }


        .back {

            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 25px;

            transition: 0.3s;
        }


        .back:hover {

            color: #22d3ee;

            background:
                rgba(34,211,238,0.15);
        }


        .container {

            width: 90%;

            max-width: 800px;

            margin: 60px auto;
        }


        .profile-card {

            padding: 45px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.12);

            backdrop-filter: blur(18px);

            border:
                1px solid
                rgba(255,255,255,0.20);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.30);
        }


        .profile-icon {

            width: 85px;

            height: 85px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

            background:
                rgba(255,79,129,0.18);
        }


        h1 {

            text-align: center;

            margin-bottom: 10px;
        }


        h1 span {
            color: #22d3ee;
        }


        .subtitle {

            text-align: center;

            color: #d8f6ff;

            margin-bottom: 35px;
        }


        .info {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }


        .info-box {

            padding: 20px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.12);
        }


        .label {

            color: #22d3ee;

            font-size: 13px;

            margin-bottom: 8px;
        }


        .value {

            font-size: 17px;

            font-weight: bold;
        }


        .buttons {

            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }


        .btn {

            text-decoration: none;

            padding: 12px 24px;

            border-radius: 25px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ff4f81,
                    #22b8d6
                );

            transition: 0.3s;
        }


        .btn:hover {

            transform: translateY(-2px);
        }


        @media(max-width: 600px) {

            .info {

                grid-template-columns: 1fr;
            }

            .profile-card {

                padding: 30px 20px;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">

        <span class="heart">❤️</span>

        Heart Disease
        <span class="blue">Identification</span>

    </div>


    <a href="{{ url_for('user_dashboard') }}"
       class="back">

        ← Dashboard

    </a>

</nav>



<div class="container">

    <div class="profile-card">


        <div class="profile-icon">

            👤

        </div>


        <h1>

            My <span>Profile</span>

        </h1>


        <p class="subtitle">

            Your account information

        </p>


        <div class="info">


            <div class="info-box">

                <div class="label">
                    USER ID
                </div>

                <div class="value">
                    {{ user.id }}
                </div>

            </div>


            <div class="info-box">

                <div class="label">
                    USERNAME
                </div>

                <div class="value">
                    {{ user.username }}
                </div>

            </div>


        </div>


        <div class="buttons">

            <a href="{{ url_for('my_records') }}"
               class="btn">

                📋 My Records

            </a>


            <a href="{{ url_for('predictor') }}"
               class="btn">

                ❤️ Start Identification

            </a>

        </div>


    </div>

</div>


</body>

</html>
