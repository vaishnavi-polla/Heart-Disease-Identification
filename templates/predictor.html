<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Health Assessment</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color: white;
     }
        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            background:rgba(6, 87, 131, 0.906);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            color: #071e3d;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #071e3d;
            font-size: 16px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #e63956;
        }


        /* ================= FORM AREA ================= */


        /* ================= HEADING ================= */

        .form-container h1 {
            text-align: center;

            font-size: 32px;

            margin-bottom: 15px;

            color: #071e3d;
        }

        .form-container p {
            text-align: center;

            margin-bottom: 30px;

            color: #172b4d;

            font-size: 16px;
        }


        /* ================= LABELS ================= */

        label {
            display: block;

            margin-top: 18px;
            margin-bottom: 7px;

            font-size: 16px;

            font-weight: bold;

            color: #071e3d;
        }


        /* ================= INPUTS ================= */

        input,
        select {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid rgba(0, 0, 0, 0.20);

            border-radius: 8px;

            background: #ffffff;

            color: #111;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #0077b6;

            box-shadow: 0 0 5px rgba(0, 119, 182, 0.30);
        }


        /* ================= BUTTON ================= */

        button {
            width: 100%;

            margin-top: 30px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #071e3d;

            color: #ffffff;
            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0b4777;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .navbar {
                padding: 0 4%;
            }

            .logo {
                font-size: 18px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .form-container {
                width: 92%;

                padding: 30px 25px;

                margin: 30px auto;
            }

            .form-container h1 {
                font-size: 27px;
            }
        }
         
        .form-container {
    width: 680px;
    max-width: 48%;

    margin: 40px auto;

    padding: 30px 40px;

    background: #f4f8fc;

    border: 1px solid #d5e2ec;
    border-radius: 16px;

    box-shadow: 0 8px 25px rgba(7, 30, 61, 0.15);
    </style>
   
    }

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ❤️ HeartCare
        </div>

        <div class="nav-links">

            <a href="/user-dashboard">Dashboard</a>
            <a href="/login">Login</a>

        </div>

    </nav>


    <section class="admin-page">

       
            <div class="form-container">

            <h1 style="color: #0b4777;">Heart Health Assessment</h1>

            <p align="center">
                Please provide the following information
                for your assessment.
            </p>


            <form action="/predict" method="POST" style="color:lightpink;" autocomplete="off">


                <!-- Age -->

                <label for="age">
                    Age
                </label>

                <input type="number" id="age" name="age" min="1" max="120" required>


                <!-- Sex -->

                <label for="sex">
                    Sex
                </label>

                <select id="sex" name="sex" required>

                    <option value="">
                        Select
                    </option>

                    <option value="1">
                        Male
                    </option>

                    <option value="0">
                        Female
                    </option>

                </select>


                <!-- Chest Pain -->

                <label for="cp">
                    Chest Pain Type
                </label>

                <select id="cp" name="cp" required>

                    <option value="">
                        Select chest pain type
                    </option>

                    <option value="0">
                        Typical Angina
                    </option>

                    <option value="1">
                        Atypical Angina
                    </option>

                    <option value="2">
                        Non-Anginal Pain
                    </option>

                    <option value="3">
                        Asymptomatic
                    </option>

                </select>


                <!-- Blood Pressure -->

                <label for="trestbps">
                    Resting Blood Pressure
                </label>

                <input type="number" id="trestbps" name="trestbps" min="50" max="250" required>


                <!-- Cholesterol -->

                <label for="chol">
                    Cholesterol
                </label>

                <input type="number" id="chol" name="chol" min="50" max="700" required>


                <!-- Fasting Blood Sugar -->

                <label for="fbs">
                    Fasting Blood Sugar
                </label>

                <select id="fbs" name="fbs" required>

                    <option value="">
                        Select
                    </option>

                    <option value="1">
                        Yes
                    </option>

                    <option value="0">
                        No
                    </option>

                </select>


                <!-- Rest ECG -->

                <label for="restecg">
                    Resting ECG
                </label>

                <select id="restecg" name="restecg" required>

                    <option value="">
                        Select
                    </option>

                    <option value="0">
                        Normal
                    </option>

                    <option value="1">
                        ST-T Wave Abnormality
                    </option>

                    <option value="2">
                        Left Ventricular Hypertrophy
                    </option>

                </select>


                <!-- Maximum Heart Rate -->

                <label for="thalach">
                    Maximum Heart Rate
                </label>

                <input type="number" id="thalach" name="thalach" min="50" max="250" required>


                <!-- Exercise Angina -->

                <label for="exang">
                    Exercise-Induced Angina
                </label>

                <select id="exang" name="exang" required>

                    <option value="">
                        Select
                    </option>

                    <option value="1">
                        Yes
                    </option>

                    <option value="0">
                        No
                    </option>

                </select>


                <!-- Oldpeak -->

                <label for="oldpeak">
                    ST Depression (Oldpeak)
                </label>

                <input type="number" id="oldpeak" name="oldpeak" step="0.1" min="0" max="10" required>


                <!-- Slope -->

                <label for="slope">
                    ST Segment Slope
                </label>

                <select id="slope" name="slope" required>

                    <option value="">
                        Select
                    </option>

                    <option value="0">
                        Upsloping
                    </option>

                    <option value="1">
                        Flat
                    </option>

                    <option value="2">
                        Downsloping
                    </option>

                </select>


                <!-- CA -->

                <label for="ca">
                    Number of Major Vessels
                </label>

                <select id="ca" name="ca" required>

                    <option value="">
                        Select
                    </option>

                    <option value="0">
                        0
                    </option>

                    <option value="1">
                        1
                    </option>

                    <option value="2">
                        2
                    </option>

                    <option value="3">
                        3
                    </option>

                </select>


                <!-- Thal -->

                <label for="thal">
                    Thalassemia
                </label>

                <select id="thal" name="thal" required>

                    <option value="">
                        Select
                    </option>

                    <option value="0">
                        Normal
                    </option>

                    <option value="1">
                        Fixed Defect
                    </option>

                    <option value="2">
                        Reversible Defect
                    </option>

                </select>


                <!-- Submit -->

                <button type="submit">
                    Predict
                </button>

            </form>
        </div>
        
    </section>

</body>

</html>
